[build-system]
requires = ["setuptools>=68.0", "setuptools-scm>=8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "traktor-data-converter"
version = "1.1.3"
description = "Convertisseur multi-formats de bibliotheques DJ (Traktor, Rekordbox, Serato, VirtualDJ)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [
    { name = "Lorys Marrocco", email = "l.marrocco@nowcode.ch" },
]
keywords = ["traktor", "rekordbox", "serato", "virtualdj", "dj", "converter", "nml"]

dependencies = [
    "lxml>=5.0",
    "click>=8.1",
    "rich>=13.0",
    "pydantic>=2.0",
    "mutagen>=1.47",
    "Pillow>=10.0",
    "eval-type-backport>=0.2.0; python_version < '3.10'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
]

[project.scripts]
traktor-convert = "traktord.cli:cli"

[project.gui-scripts]
traktor-converter = "traktord.gui:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
traktord = ["logo.png"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.mypy]
python_version = "3.11"
strict = true
